services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: moby
      POSTGRES_USER: moby
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moby -d moby"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
